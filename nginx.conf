server {
    listen 80;
    server_name localhost;

    # Nén Gzip tối ưu tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 1. Phục vụ Single Page App (React / Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache file tĩnh (JS/CSS có hash tên file)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Proxy API đến Golang Backend
    # ${BACKEND_URL} được nginx image thay từ biến môi trường khi khởi động
    # (local: http://backend:8000, production: https://<app>.azurecontainerapps.io)
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        # Azure Container Apps định tuyến theo Host -> phải gửi đúng host của backend
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 3. Proxy WebSocket Live Chat đến Golang Backend
    location /ws/ {
        proxy_pass ${BACKEND_URL}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Proxy HLS Video Stream đến SRS Media Server
    location /live/ {
        proxy_pass http://srs:8080/live/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # 5. Proxy WebRTC Signaling đến SRS Media Server
    location /rtc/ {
        proxy_pass http://srs:8080/rtc/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # 6. Proxy SRS Management API
    location /srs-api/ {
        proxy_pass http://srs:8080/api/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}
