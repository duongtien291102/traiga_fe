<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trại Gà Thành Trung Long Biên - Trực Tiếp &amp; Giao Lưu Chiến Kê</title>
    <meta name="description" content="Trại Gà Thành Trung Long Biên - Phát trực tiếp xổ đòn thử chân, soi cán vảy và giao lưu chiến kê tuyển chọn." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('traiga_theme');
          if (t === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
